<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 154.2 120"
     width="154.2" height="120">

  <!-- PCB Arduino UNO R3 -->
  <path d="
    M28 15
    H137
    Q143 15 143 21
    V38
    L149 44
    V92
    Q149 100 141 100
    H28
    Q23 100 23 95
    V22
    Q23 15 28 15 Z"
    fill="#159b9b"
    stroke="#086060"
    stroke-width="2.5"/>

  <!-- USB-B -->
  <rect x="7" y="33" width="31" height="27"
        rx="2"
        fill="#c8c8c8"
        stroke="#666"
        stroke-width="2"/>

  <rect x="9" y="36" width="27" height="21"
        fill="#dedede"/>

  <rect x="7" y="40" width="5" height="13"
        fill="#8b8b8b"/>

  <!-- Jack alimentazione -->
  <rect x="15" y="79" width="27" height="19"
        rx="3"
        fill="#202020"
        stroke="#090909"
        stroke-width="2"/>

  <circle cx="37" cy="88.5" r="6"
          fill="#444"
          stroke="#777"
          stroke-width="1.5"/>

  <!-- RESET -->
  <rect x="28" y="19" width="16" height="14"
        rx="2"
        fill="#cfcfcf"
        stroke="#777"
        stroke-width="1.5"/>

  <circle cx="36" cy="26" r="5"
          fill="#dedede"
          stroke="#999"
          stroke-width="1"/>

  <!-- Fori di montaggio REALI -->
  <circle cx="49" cy="24" r="4.2"
          fill="#e7e7e7"
          stroke="#087070"
          stroke-width="1.5"/>

  <circle cx="140" cy="47" r="4.2"
          fill="#e7e7e7"
          stroke="#087070"
          stroke-width="1.5"/>

  <circle cx="140" cy="91" r="4.2"
          fill="#e7e7e7"
          stroke="#087070"
          stroke-width="1.5"/>

  <circle cx="46" cy="95" r="4.2"
          fill="#e7e7e7"
          stroke="#087070"
          stroke-width="1.5"/>

  <!-- Header DIGITAL superiore -->
  <rect x="55" y="18" width="80" height="8"
        rx="1"
        fill="#222"/>

  <g fill="#111">
    <rect x="59" y="20" width="4" height="4"/>
    <rect x="66" y="20" width="4" height="4"/>
    <rect x="73" y="20" width="4" height="4"/>
    <rect x="80" y="20" width="4" height="4"/>
    <rect x="87" y="20" width="4" height="4"/>
    <rect x="94" y="20" width="4" height="4"/>
    <rect x="101" y="20" width="4" height="4"/>
    <rect x="108" y="20" width="4" height="4"/>
    <rect x="115" y="20" width="4" height="4"/>
    <rect x="122" y="20" width="4" height="4"/>
    <rect x="129" y="20" width="4" height="4"/>
  </g>

  <!-- Header POWER + ANALOG inferiore -->
  <rect x="72" y="94" width="64" height="7"
        rx="1"
        fill="#222"/>

  <g fill="#111">
    <rect x="76" y="96" width="4" height="3"/>
    <rect x="83" y="96" width="4" height="3"/>
    <rect x="90" y="96" width="4" height="3"/>
    <rect x="97" y="96" width="4" height="3"/>
    <rect x="104" y="96" width="4" height="3"/>
    <rect x="111" y="96" width="4" height="3"/>
    <rect x="118" y="96" width="4" height="3"/>
    <rect x="125" y="96" width="4" height="3"/>
    <rect x="132" y="96" width="4" height="3"/>
  </g>

  <!-- ATmega328P DIP -->
  <rect x="78" y="69" width="57" height="19"
        rx="2"
        fill="#202020"
        stroke="#090909"
        stroke-width="2"/>

  <!-- Tacche DIP -->
  <circle cx="87" cy="78.5" r="3"
          fill="#353535"/>

  <circle cx="126" cy="78.5" r="3"
          fill="#353535"/>

  <!-- Pin ATmega -->
  <g stroke="#c9c9c9" stroke-width="1.3">
    <line x1="81" y1="67" x2="81" y2="69"/>
    <line x1="87" y1="67" x2="87" y2="69"/>
    <line x1="93" y1="67" x2="93" y2="69"/>
    <line x1="99" y1="67" x2="99" y2="69"/>
    <line x1="105" y1="67" x2="105" y2="69"/>
    <line x1="111" y1="67" x2="111" y2="69"/>
    <line x1="117" y1="67" x2="117" y2="69"/>
    <line x1="123" y1="67" x2="123" y2="69"/>
    <line x1="129" y1="67" x2="129" y2="69"/>

    <line x1="81" y1="88" x2="81" y2="90"/>
    <line x1="87" y1="88" x2="87" y2="90"/>
    <line x1="93" y1="88" x2="93" y2="90"/>
    <line x1="99" y1="88" x2="99" y2="90"/>
    <line x1="105" y1="88" x2="105" y2="90"/>
    <line x1="111" y1="88" x2="111" y2="90"/>
    <line x1="117" y1="88" x2="117" y2="90"/>
    <line x1="123" y1="88" x2="123" y2="90"/>
    <line x1="129" y1="88" x2="129" y2="90"/>
  </g>

  <!-- ATmega16U2 vicino USB -->
  <rect x="49" y="46" width="15" height="15"
        rx="1.5"
        fill="#303030"
        stroke="#111"
        stroke-width="1.5"/>

  <!-- Quarzo -->
  <rect x="46" y="67" width="23" height="9"
        rx="4"
        fill="#d7d7d7"
        stroke="#777"
        stroke-width="1.5"/>

  <!-- Condensatori -->
  <circle cx="57" cy="87" r="5"
          fill="#d9d9d9"
          stroke="#777"
          stroke-width="1.3"/>

  <circle cx="69" cy="87" r="5"
          fill="#d9d9d9"
          stroke="#777"
          stroke-width="1.3"/>

  <!-- ICSP -->
  <rect x="136" y="60" width="10" height="17"
        rx="1"
        fill="#252525"/>

  <g fill="#d2b04b">
    <circle cx="139" cy="64" r="1.3"/>
    <circle cx="143" cy="64" r="1.3"/>
    <circle cx="139" cy="68.5" r="1.3"/>
    <circle cx="143" cy="68.5" r="1.3"/>
    <circle cx="139" cy="73" r="1.3"/>
    <circle cx="143" cy="73" r="1.3"/>
  </g>

  <!-- LED ON -->
  <circle cx="127" cy="45" r="2.4"
          fill="#e6d84c"
          stroke="#7d711d"
