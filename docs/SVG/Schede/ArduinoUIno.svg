  <!-- Logo Arduino semplificato -->
  <circle cx="88" cy="44" r="8"
          fill="none"
          stroke="#ffffff"
          stroke-width="3"/>

  <circle cx="105" cy="44" r="8"
          fill="none"
          stroke="#ffffff"
          stroke-width="3"/>

  <line x1="84" y1="44" x2="92" y2="44"
        stroke="#ffffff"
        stroke-width="2"/>

  <line x1="101" y1="44" x2="109" y2="44"
        stroke="#ffffff"
        stroke-width="2"/>

  <line x1="105" y1="40" x2="105" y2="48"
        stroke="#ffffff"
        stroke-width="2"/>

  <!-- Serigrafia principale -->
  <text x="96" y="60"
      text-anchor="middle"
      font-family="Arial, sans-serif"
      font-size="6"
      font-weight="bold"
      fill="#ffffff">ARDUINO</text>

  <text x="96" y="65"
      text-anchor="middle"
      font-family="Arial, sans-serif"
      font-size="5"
      font-weight="bold"
      fill="#ffffff">UNO</text>

</svg>
