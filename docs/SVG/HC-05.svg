<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 160 120"
     width="160" height="120">

  <!-- PCB breakout HC-05 -->
  <rect x="47" y="10" width="66" height="91"
        rx="4"
        fill="#1268b3"
        stroke="#083d73"
        stroke-width="3"/>

  <!-- Piccoli fori di fissaggio -->
  <circle cx="54" cy="18" r="2.5"
          fill="#e5e5e5"
          stroke="#083d73"
          stroke-width="1.5"/>

  <circle cx="106" cy="18" r="2.5"
          fill="#e5e5e5"
          stroke="#083d73"
          stroke-width="1.5"/>

  <!-- Modulo Bluetooth verde -->
  <rect x="57" y="18" width="46" height="61"
        rx="2"
        fill="#2d9b68"
        stroke="#175c41"
        stroke-width="2.5"/>

  <!-- Area antenna -->
  <rect x="63" y="22" width="34" height="22"
        rx="1"
        fill="#3cac76"
        stroke="#175c41"
        stroke-width="1.5"/>

  <!-- Antenna PCB a zig-zag -->
  <path d="
        M66 27
        H93
        V31
        H70
        V35
        H93
        V39
        H70"
        fill="none"
        stroke="#d9c45a"
        stroke-width="2.5"
        stroke-linecap="square"
        stroke-linejoin="miter"/>

  <!-- Chip principale -->
  <rect x="68" y="50" width="23" height="18"
        rx="1.5"
        fill="#252525"
        stroke="#111"
        stroke-width="1.5"/>

  <!-- Piedini chip -->
  <g stroke="#d0d0d0" stroke-width="1.5">
    <line x1="66" y1="53" x2="68" y2="53"/>
    <line x1="66" y1="57" x2="68" y2="57"/>
    <line x1="66" y1="61" x2="68" y2="61"/>
    <line x1="66" y1="65" x2="68" y2="65"/>

    <line x1="91" y1="53" x2="93" y2="53"/>
    <line x1="91" y1="57" x2="93" y2="57"/>
    <line x1="91" y1="61" x2="93" y2="61"/>
    <line x1="91" y1="65" x2="93" y2="65"/>
  </g>

  <!-- Componenti inferiori -->
  <rect x="57" y="83" width="9" height="6"
        rx="1"
        fill="#333"
        stroke="#172c3e"
        stroke-width="1"/>

  <rect x="72" y="83" width="9" height="6"
        rx="1"
        fill="#d5b44d"
        stroke="#765f20"
        stroke-width="1"/>

  <rect x="87" y="83" width="10" height="6"
        rx="1"
        fill="#333"
        stroke="#172c3e"
        stroke-width="1"/>

  <!-- LED di stato -->
  <circle cx="104" cy="86" r="2.5"
          fill="#e53935"
          stroke="#7c1717"
          stroke-width="1"/>

  <!-- Connettore 6 pin -->
  <rect x="52" y="94" width="56" height="7"
        rx="1"
        fill="#242424"/>

  <!-- PIN metallici -->
  <g fill="#d9bd54"
     stroke="#8a742d"
     stroke-width="0.8">

    <rect x="55" y="99" width="4" height="11"/>
    <rect x="64" y="99" width="4" height="11"/>
    <rect x="73" y="99" width="4" height="11"/>
    <rect x="82" y="99" width="4" height="11"/>
    <rect x="91" y="99" width="4" height="11"/>
    <rect x="100" y="99" width="4" height="11"/>

  </g>

</svg>