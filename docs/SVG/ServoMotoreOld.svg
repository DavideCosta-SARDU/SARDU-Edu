  <!-- Centro leva -->
  <circle cx="69.5" cy="32" r="7"
          fill="#eeeeee"
          stroke="#555555"
          stroke-width="2"/>

  <!-- Fori leva -->
  <circle cx="88" cy="32" r="2.5"
          fill="white"
          stroke="#777"
          stroke-width="1.5"/>

  <circle cx="99" cy="32" r="2.5"
          fill="white"
          stroke="#777"
          stroke-width="1.5"/>

  <circle cx="110" cy="32" r="2.5"
          fill="white"
          stroke="#777"
          stroke-width="1.5"/>

  <!-- Uscita cavo -->
  <rect x="106" y="77" width="5" height="13"
        rx="1"
        fill="#333"/>

  <!-- Fili -->
  <path d="M111 80
           C118 80 119 76 126 76
           H149"
        fill="none"
        stroke="#8b4513"
        stroke-width="3"
        stroke-linecap="round"/>

  <path d="M111 84
           C118 84 119 81 126 81
           H149"
        fill="none"
        stroke="#e31b23"
        stroke-width="3"
        stroke-linecap="round"/>

  <path d="M111 88
