<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 160 120"
     width="160" height="120">

  <!-- Corpo principale -->
  <rect x="35" y="42" width="72" height="58"
        rx="5"
        fill="#0875e1"
        stroke="#073c82"
        stroke-width="3"/>

  <!-- Parte superiore corpo -->
  <path d="M35 66 H107"
        fill="none"
        stroke="#073c82"
        stroke-width="3"/>

  <!-- Piedino di montaggio SOLO a destra -->
  <path d="M107 49
           H122
           Q127 49 127 54
           V65
           Q127 70 122 70
           H107 Z"
        fill="#0875e1"
        stroke="#073c82"
        stroke-width="3"/>

  <!-- Foro piedino -->
  <circle cx="118" cy="59.5" r="4.5"
          fill="white"
          stroke="#073c82"
          stroke-width="2.5"/>

  <!-- Supporto asse -->
  <path d="M52 42
           V34
           Q52 24 63 24
           H76
           Q87 24 87 34
           V42 Z"
        fill="#0875e1"
        stroke="#073c82"
        stroke-width="3"/>

  <!-- Asse circolare -->
  <circle cx="69.5" cy="32" r="12"
          fill="#0875e1"
          stroke="#073c82"
          stroke-width="3"/>

  <!-- LEVA CORTA SOLO VERSO DESTRA -->
  <path d="M69.5 27
           H112
           Q117 27 117 32
           Q117 37 112 37
           H69.5 Z"
        fill="#f5f5f5"
