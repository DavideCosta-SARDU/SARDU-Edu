<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="13.34 34 138.32 52"
     width="160" height="120">

  <!-- ========================= -->
  <!-- PCB -->
  <!-- ========================= -->

  <rect x="16" y="35"
        width="128" height="50"
        rx="3"
        fill="#c92d32"
        stroke="#76191d"
        stroke-width="3"/>

  <!-- leggere piste PCB -->
  <path d="
        M47 43 H72
        M47 76 H69
        M91 45 H124
        M91 75 H122"
        fill="none"
        stroke="#a82127"
        stroke-width="1.3"/>


  <!-- ========================= -->
  <!-- MICROFONO ELECTRET -->
  <!-- ========================= -->

  <!-- ombra/base -->
  <circle cx="37" cy="60" r="18"
          fill="#8b8b8b"
          stroke="#4b4b4b"
          stroke-width="2.5"/>

  <!-- capsula metallica -->
  <circle cx="37" cy="60" r="15"
          fill="#d7d7d7"
          stroke="#686868"
          stroke-width="2"/>

  <!-- anello superiore -->
  <circle cx="37" cy="60" r="11.5"
          fill="#bcbcbc"
          stroke="#858585"
          stroke-width="1.3"/>

  <!-- superficie interna -->
  <circle cx="37" cy="60" r="8.5"
          fill="#d4d4d4"/>

  <!-- foro acustico -->
  <circle cx="37" cy="60" r="2.8"
          fill="#343434"/>


  <!-- ========================= -->
  <!-- TRIMMER BLU -->
  <!-- ========================= -->

  <rect x="57" y="45"
        width="25" height="27"
        rx="3"
        fill="#176bc1"
        stroke="#08437d"
        stroke-width="2.2"/>

  <!-- vite regolazione -->
  <circle cx="69.5" cy="58.5" r="7"
          fill="#d9d9d9"
          stroke="#666666"
          stroke-width="1.5"/>

  <line x1="65" y1="58.5"
        x2="74" y2="58.5"
        stroke="#555555"
        stroke-width="2"/>


  <!-- ========================= -->
  <!-- COMPARATORE / IC -->
  <!-- ========================= -->

  <rect x="89" y="52"
        width="20" height="14"
        rx="1.5"
        fill="#252525"
        stroke="#101010"
        stroke-width="1.5"/>

  <!-- piedini IC -->
  <g stroke="#c8c8c8" stroke-width="1.5">
    <line x1="92" y1="49" x2="92" y2="52"/>
    <line x1="97" y1="49" x2="97" y2="52"/>
    <line x1="102" y1="49" x2="102" y2="52"/>
    <line x1="107" y1="49" x2="107" y2="52"/>

    <line x1="92" y1="66" x2="92" y2="69"/>
    <line x1="97" y1="66" x2="97" y2="69"/>
    <line x1="102" y1="66" x2="102" y2="69"/>
    <line x1="107" y1="66" x2="107" y2="69"/>
  </g>


  <!-- ========================= -->
  <!-- COMPONENTI SMD -->
  <!-- ========================= -->

  <rect x="87" y="40"
        width="11" height="5"
        rx="1"
        fill="#d8c8a0"
        stroke="#725f43"
        stroke-width="1"/>

  <rect x="103" y="40"
        width="10" height="5"
        rx="1"
        fill="#333333"/>

  <rect x="88" y="73"
        width="10" height="5"
        rx="1"
        fill="#d8c8a0"
        stroke="#725f43"
        stroke-width="1"/>

  <rect x="103" y="73"
        width="10" height="5"
        rx="1"
        fill="#333333"/>


  <!-- LED -->
  <circle cx="119" cy="46"
          r="3"
          fill="#e9d64a"
          stroke="#8d7620"
          stroke-width="1"/>

  <circle cx="119" cy="74"
          r="3"
          fill="#e9d64a"
          stroke="#8d7620"
          stroke-width="1"/>


  <!-- ========================= -->
  <!-- CONNETTORE 4 PIN -->
  <!-- ========================= -->

  <rect x="126" y="42"
        width="9" height="36"
        rx="1"
        fill="#252525"/>

  <!-- quattro pin verso destra -->
  <g fill="#d3b34d"
     stroke="#806a28"
     stroke-width="0.8">

    <rect x="133" y="45"
          width="16" height="4"/>

    <rect x="133" y="54"
          width="16" height="4"/>

    <rect x="133" y="63"
          width="16" height="4"/>

    <rect x="133" y="72"
          width="16" height="4"/>

  </g>

</svg>
