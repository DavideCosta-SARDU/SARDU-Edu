<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="44.64 20.26 70.72 90.48"
     width="160" height="120">

  <!-- Corpo buzzer -->
  <circle cx="80" cy="56" r="34"
          fill="#2b2b2b"
          stroke="#111111"
          stroke-width="3"/>

  <!-- Parte superiore -->
  <circle cx="80" cy="53" r="28"
          fill="#3b3b3b"
          stroke="#151515"
          stroke-width="2"/>

  <!-- Foro acustico -->
  <circle cx="80" cy="53" r="8"
          fill="#111111"
          stroke="#050505"
          stroke-width="1.5"/>

  <!-- Segno + -->
  <g stroke="#e6e6e6"
     stroke-width="3"
     stroke-linecap="round">
    <line x1="97" y1="32" x2="107" y2="32"/>
    <line x1="102" y1="27" x2="102" y2="37"/>
  </g>

  <!-- Base -->
  <rect x="56" y="83" width="48" height="8"
        rx="2"
        fill="#1f1f1f"
        stroke="#101010"
        stroke-width="2"/>

  <!-- Piedino sinistro -->
  <rect x="63" y="89" width="6" height="20"
        rx="1"
        fill="#c7c7c7"
        stroke="#777777"
        stroke-width="1.2"/>

  <!-- Piedino destro -->
  <rect x="91" y="89" width="6" height="20"
        rx="1"
        fill="#c7c7c7"
        stroke="#777777"
        stroke-width="1.2"/>

</svg>
